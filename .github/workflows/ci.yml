name: Tests de l'application

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CI: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Vérifier le démarrage du workflow
        run: echo "Le workflow fonctionne."

      - name: Récupérer le code
        uses: actions/checkout@v7
        
      - name: Préparer Node.js et le cache npm
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
          
      - name: Installer jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Installer les dépendances du projet
        run: npm ci

      - name: Exécuter les tests
        run: bash ./scripts/run-tests.sh
