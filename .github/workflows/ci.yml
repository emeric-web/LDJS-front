name: Tests et publication Docker

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CI: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Préparer Node.js et le cache npm
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Installer jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Installer les dépendances du projet
        run: npm ci

      - name: Exécuter les tests
        run: bash ./scripts/run-tests.sh

      - name: Sauvegarder le rapport JUnit
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-junit
          path: test-results/junit.xml
          retention-days: 7
          if-no-files-found: error

      - name: Afficher les résultats des tests
        if: success() || failure()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: test-results/junit.xml
          annotate_only: true
          job_summary: true
          detailed_summary: true
          fail_on_parse_error: true
          require_tests: true

  build:
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Préparer le nom de l'image
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          branch=$(printf '%s' "$GITHUB_REF_NAME" | sed -E 's/[^a-zA-Z0-9_.-]+/-/g; s/^[.-]+/_/')
          tag="${branch:0:80}-${GITHUB_SHA:0:7}"
          echo "IMAGE=$REGISTRY/$repository:$tag" >> "$GITHUB_ENV"

      - name: Se connecter à GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Construire l'image
        run: docker build -t "$IMAGE" .

      - name: Publier l'image
        run: docker push "$IMAGE"
